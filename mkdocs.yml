site_name: WHRG 2026 イベントレポート
site_description: 世界人型ロボット競技大会（WHRG）2026の競技、参加者、会場、結果、データ公開を解説・検証する報告
site_url: https://takasumasakazu.net/whrg-report/
repo_url: https://github.com/Nico-Tech-Shenzhen/whrg-report
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - WHRG 2026 大会概要: index.md
  - 第1章 大会規模と競技構成: ch01.md
  - 第2章 競技種目と評価指標: ch02.md
  - 第3章 実環境タスク競技: ch03.md
  - 第4章 競技結果と技術的到達点: ch04.md
  - 第5章 参加チーム・ロボットプラットフォーム・運営基盤: ch05.md
  - 第6章 大会データセットの構成: ch06.md
  - 第7章 データセットの公開状況と再利用性: ch07.md
  - 第8章 2025年から2026年の変化と大会後の展開: ch08.md
  - 付録 調査方法・全結果・補足資料: appendix.md
