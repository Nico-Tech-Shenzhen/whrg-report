site_name: WHRG 2026 イベントレポート
site_description: 世界人型ロボット競技大会（WHRG）2026の競技、参加者、会場、結果、データ公開を解説・検証する報告
site_url: https://takasumasakazu.net/whrg-report/
repo_url: https://github.com/Nico-Tech-Shenzhen/whrg-report
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - はじめに: index.md
  - 第1章 WHRG 2026の全体像: ch01.md
  - 第2章 51競技で何を競ったか: ch02.md
  - 第3章 21の実環境タスク競技: ch03.md
  - 第4章 主要結果と2025→2026: ch04.md
  - 第5章 大会が生んだ2,500時間超のデータ: ch05.md
  - 第6章 データはどう公開され、誰が使えるのか: ch06.md
  - 第7章 チーム・大学・メーカー・ロボット: ch07.md
  - 第8章 競技を成立させた基盤: ch08.md
  - 第9章 2025から2026へ、そして大会後: ch09.md
  - 付録: appendix.md
