site_name: WHRG 2026 調査報告
site_description: 世界人形机器人运动会2026の公開作業版調査報告
site_url: https://takasumasakazu.net/whrg-report/
repo_url: https://github.com/Nico-Tech-Shenzhen/whrg-report
theme:
  name: material
  language: ja
  features: [navigation.sections, navigation.expand, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - 大会概要: index.md
  - 51競技と結果: competitions-results.md
  - 主な記録: results-records.md
  - 場景赛でロボットは何をしたか: scenario-competitions.md
  - メダルと主要Team: medals.md
  - 2500時間超の大会データ: whrg-dataset.md
  - データは実際に使えるのか: open-knowledge.md
  - Team・メーカー・大学:
      - Competition Entry と Team: entries-teams.md
      - エコシステム構造: ecosystem.md
      - Team形成の実例: team-formation.md
  - 2025年との比較: cross-year.md
  - 大会後に残ったもの: post-event.md
  - 調査方法:
      - 調査方法: method.md
      - 大会構造とデータ境界: event-structure.md
  - 残る調査課題: open-questions.md
  - 再構成データ集計表: data-tables.md
